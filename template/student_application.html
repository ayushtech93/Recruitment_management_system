<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application | Optical Solution</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 40px 20px;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: white;
            padding: 35px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.6;
        }

        .form-content {
            padding: 35px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #0d6efd;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9dfe8;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .radio-group {
            display: flex;
            gap: 25px;
            align-items: center;
            height: 45px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
        }

        .radio-option input {
            width: auto;
        }

        .submit-area {
            margin-top: 30px;
            text-align: right;
        }

        .submit-btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #084298;
        }

        .required {
            color: #dc3545;
        }

        .note {
            margin-top: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            color: #666;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 10px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-content {
                padding: 25px 20px;
            }

            .header {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 25px;
            }

            .full-width {
                grid-column: auto;
            }

            .submit-area {
                text-align: center;
            }

            .submit-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Optical Solution</h1>
        <p>
            Job Application Form
            <br>
            Please provide accurate information. Our HR team will review your application.
        </p>
    </div>

    <div class="form-content">

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <!-- PERSONAL INFORMATION -->

            <h2 class="section-title">
                Personal Information
            </h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>
                        Full Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>
                        Email <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>
                        Mobile Number <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>
                        College / University <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="college"
                        placeholder="Enter college name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>
                        Course <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="course"
                        placeholder="e.g. MCA, BCA, B.Tech"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>
                        Passing Year <span class="required">*</span>
                    </label>

                    <input
                        type="number"
                        name="passing_year"
                        placeholder="e.g. 2026"
                        required
                    >
                </div>

                <div class="form-group full-width">
                    <label>
                        Skills <span class="required">*</span>
                    </label>

                    <textarea
                        name="skills"
                        placeholder="Example: Python, Django, HTML, CSS, JavaScript"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label>
                        Experience
                    </label>

                    <div class="radio-group">

                        <label class="radio-option">
                            <input
                                type="radio"
                                name="experience"
                                value="Fresher"
                                checked
                            >
                            Fresher
                        </label>

                        <label class="radio-option">
                            <input
                                type="radio"
                                name="experience"
                                value="Experienced"
                            >
                            Experienced
                        </label>

                    </div>
                </div>

                <div class="form-group">
                    <label>
                        Resume
                    </label>

                    <input
                        type="file"
                        name="resume"
                        accept=".pdf,.doc,.docx"
                    >
                </div>

            </div>


            <!-- APPLICATION INFORMATION -->

            <h2 class="section-title" style="margin-top: 35px;">
                Application Information
            </h2>

            <div class="form-grid">

                <div class="form-group">
                    <label>
                        Applying For <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="applied_position"
                        placeholder="e.g. Python Developer"
                        required
                    >
                </div>

                <div class="form-group full-width">
                    <label>
                        Message
                    </label>

                    <textarea
                        name="message"
                        placeholder="Tell us briefly about yourself..."
                    ></textarea>
                </div>

            </div>


            <div class="note">
                By submitting this form, you confirm that the information provided
                is accurate and complete.
            </div>


            <div class="submit-area">

                <button type="submit" class="submit-btn">
                    Submit Application
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
