<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Submitted | Optical Solution</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-card {
            width: 500px;
            max-width: 100%;
            background: white;
            padding: 50px 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e7f7ee;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        .success-card h1 {
            font-size: 28px;
            color: #222;
            margin-bottom: 15px;
        }

        .success-card p {
            color: #777;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .home-btn {
            display: inline-block;
            padding: 13px 30px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #084298;
        }

        .company-name {
            margin-top: 30px;
            color: #0d6efd;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Application Submitted!
        </h1>

        <p>
            Thank you for applying to Optical Solution.
            Your application has been successfully submitted.
            Our HR team will review your details and contact you
            if you are shortlisted.
        </p>


        <div class="company-name">
            Optical Solution
        </div>

    </div>

</body>
</html>
